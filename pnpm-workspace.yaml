packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 用 allowBuilds map 批准带 postinstall 的依赖(值必须是 boolean)。
# 旧的 onlyBuiltDependencies 列表在 v11 已废弃,改用此字段。
# electron 需下载二进制(.npmrc 已配国内镜像);esbuild 需安装原生可执行。
# (P2 用 sql.js 纯 WASM,无需 native 编译,任何机器 clone 即用。)
# @google/genai / protobufjs 是 pi SDK 的传递依赖,dist 已随包发布,
# 其 build scripts(prepare/postinstall)与运行时无关,设为 false 忽略。
allowBuilds:
  '@google/genai': false
  # Optional canvas is not used by the browser-based renderers; do not compile it.
  canvas: false
  cpu-features: true
  electron: true
  # NSIS is the configured Windows target; skip the unused Squirrel installer.
  electron-winstaller: false
  esbuild: true
  node-pty: true
  protobufjs: false
  ssh2: true

minimumReleaseAgeExclude:
  - '@openai/codex@0.153.4-darwin-arm64 || 0.153.4-darwin-x64 || 0.153.4-linux-arm64 || 0.153.4-linux-x64 || 0.153.4-win32-arm64 || 0.153.4-win32-x64 || 0.153.4'

# Security fixes verified against the official npm advisory feed (2026-09-30).
# Keep fixes within their existing major line; remove bounds as upstream minima advance.
# electron-builder 26.15.3 owns a matching app-builder-lib, so the old v25 override is gone.
overrides:
  'semver@>=5.0.0 <5.7.2': 5.7.2
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'ip-address@>=10.0.0 <10.7.1': 10.7.1
  'hono@>=4.0.0 <4.13.5': 4.13.5
  '@hono/node-server@>=1.0.0 <1.19.15': 1.19.15
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'qs@>=6.0.0 <6.16.0': 6.16.0
  'dompurify@>=3.0.0 <3.4.13': 3.4.13
  'postcss@>=8.0.0 <8.5.23': 8.5.23
  'undici@>=8.0.0 <8.10.2': 8.10.2
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'ejs@>=3.0.0 <3.1.10': 3.1.10
  '@xmldom/xmldom@>=0.9.0 <0.9.12': 0.9.12
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  # pptx-preview imports only uuid.v4 and the ECharts public rendering API.
  # Their maintained fixes require major upgrades; verify real PPTX chart rendering.
  'pptx-preview>uuid': 11.1.1
  'pptx-preview>echarts': 6.1.0

patchedDependencies:
  '@anthropic-ai/claude-agent-sdk@0.3.258': patches/@anthropic-ai__claude-agent-sdk@0.3.258.patch
