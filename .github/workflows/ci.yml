# PRs run typechecks and the critical regression gate. Master pushes and an
# explicit manual request also run the full dynamically discovered smoke set.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all headless smoke suites
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    # Preserve the existing required-check name for branch protection.
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow-seed-smoke compares an actual historical asset revision.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Setup virtual display for isolated Electron host
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Critical regression gate
        run: pnpm test

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            apps/desktop/.tmp/smoke-runs/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # The smoke suites are authored and maintained on Windows (hard-coded drive
  # paths, cmd.exe / Windows services / case-insensitive FS assertions, the
  # owned-Chrome DevTools handshake). The app ships for Windows and macOS only,
  # so the broad gates run on the same Windows image the release job packages on.
  # On ubuntu 38 of 173 suites failed purely on platform assumptions (2026-09-30).
  smoke-windows:
    name: Smoke (Windows)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow-seed-smoke compares an actual historical asset revision.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # setuptools: distutils shim for node-gyp@9 on Python 3.12+ (same as release.yml).
      # openpyxl: mcp-endpoint-smoke builds its .xlsx fixture with it.
      - name: Python packages for native rebuild and fixtures
        run: python -m pip install setuptools openpyxl

      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup browser for workflow regressions
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Workflow integration regressions
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.full)
        env:
          MCODE_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:smoke workflow-ui-smoke code-electron-smoke automation-smoke node-session-smoke

      - name: Full smoke gate
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full)
        env:
          MCODE_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:all

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-windows
          path: |
            apps/desktop/.tmp/smoke-runs/**/*.log
            apps/desktop/.tmp/workflow-ui-*/*.json
            apps/desktop/.tmp/workflow-ui-*/*.png
            apps/desktop/.tmp/workflow-electron-*/*-result.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
